<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0a5a37">
<meta name="robots" content="noindex">
<title>Admin login - Duka</title>
<link rel="stylesheet" href="/css/app.css">
</head>
<body>
<main class="auth">
    <h1 class="wordmark">Duka</h1>
    <p class="tag">Administrator login</p>
    <form id="loginForm" class="card" novalidate>
        <p id="formError" class="form-error" role="alert" hidden></p>
        <div class="field">
            <label for="phone">Phone number</label>
            <input class="input" id="phone" name="phone" type="tel" inputmode="tel" autocomplete="username" placeholder="0772 123 456">
        </div>
        <div class="field">
            <label for="password">Password</label>
            <input class="input" id="password" name="password" type="password" autocomplete="current-password">
        </div>
        <button class="btn block" id="submit" type="submit">Log in</button>
    </form>
</main>
<script src="/js/api.js"></script>
<script src="/js/ui.js"></script>
<script src="/js/admin-login.js"></script>
</body>
</html>
